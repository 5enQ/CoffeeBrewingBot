name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live
        run: |
          rm -rf out; mkdir -p out
          A=https://brewbook-ratings.brewbook.workers.dev
          curl -sS -m 20 $A/version -o out/version.json
          curl -sS -m 20 "$A/roasters?t=$(date +%s)" -o out/roasters.json
          for h in shop.tastycoffee.ru kojocoffee.ru sbmrne.ru theweldercatherine.ru hq-coffee.com; do curl -sS -m 20 "$A/catalog/list?host=$h&t=$(date +%s)" -o out/list-$h.json; done
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: sitemaps [skip ci]" && git push
