name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live
        run: |
          rm -rf out; mkdir -p out
          A=https://brewbook-ratings.brewbook.workers.dev
          curl -sS -m 20 $A/version -o out/version.json
          curl -sS -m 20 $A/roasters -o out/roasters0.json
          sleep 240
          curl -sS -m 20 "$A/roasters?t=$(date +%s)" -H 'Cache-Control: no-cache' -o out/roasters.json
          for h in shop.tastycoffee.ru kojocoffee.ru sbmrne.ru theweldercatherine.ru hq-coffee.com; do curl -sS -m 20 "$A/catalog/list?host=$h&kind=beans&t=$(date +%s)" -o out/list-$h.json; done
          curl -sS -m 20 "$A/lookup?url=https://shop.tastycoffee.ru/coffee/braziliya-sul-de-minas?back=%2Fcoffee" -o out/lookup-tasty.json
          curl -sS -m 20 "$A/lookup?url=https://example-roaster-test.ru/coffee/x" -o out/lookup-unknown.json
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: sitemaps [skip ci]" && git push
