# Brewbook recipe ratings server (Cloudflare Workers, free plan)
name = "brewbook-ratings"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object per author: SQLite with ratings of their recipes inside
[[durable_objects.bindings]]
name = "AUTHORS"
class_name = "AuthorRatings"

# Recipes for short "Share" links
[[durable_objects.bindings]]
name = "RECIPES"
class_name = "RecipeStore"

# Shared coffee catalog: lots by QR link and barcode (basis for the global coffee rating)
[[durable_objects.bindings]]
name = "CATALOG"
class_name = "CoffeeCatalog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthorRatings"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecipeStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CoffeeCatalog"]

[vars]
# Allowed request origin (the Mini App site)
ALLOWED_ORIGIN = "https://5enq.github.io"

# The BOT_TOKEN secret is set via `wrangler secret put BOT_TOKEN` (or GitHub Actions)

# Heartbeat for the catalog crawler (it schedules its own steps; this only makes sure it keeps running)
[triggers]
crons = ["23 */6 * * *"]
