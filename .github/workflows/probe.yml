name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          rm -rf out; mkdir -p out/p
          UA="Mozilla/5.0 (compatible; BrewbookBot/1.0; +https://5enq.github.io/CoffeeBrewingBot/)"
          get() { curl -sSL -m 30 -A "$UA" -w "%{http_code} %{size_download} %{url_effective}\n" "$2" -o "out/$1" >> out/_status.txt 2>&1 || echo "ERR $2" >> out/_status.txt; }
          get kojo-part1.xml https://kojocoffee.ru/sitemap-store-part1.xml
          get kojo-parts.xml https://kojocoffee.ru/sitemap-store-parts.xml
          i=0; while read u; do i=$((i+1)); get "p/$i.html" "$u"; echo "$i $u" >> out/p/index.txt; done < urls.list
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: sitemaps [skip ci]" && git push
