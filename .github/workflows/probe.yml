name: Probe rockets.coffee
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reachability (status codes and timings only)
        run: |
          set +e
          rm -rf out; mkdir -p out
          UA="Mozilla/5.0 (compatible; BrewbookBot/1.0; +https://5enq.github.io/CoffeeBrewingBot/)"
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          R=https://rockets.coffee
          curl -sS --max-time 25 -A "$BR" $R/robots.txt -o out/robots.txt
          for v in --http1.1 --http2; do for acc in "application/xml" "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"; do
            curl -sS --max-time 25 $v -A "$BR" -H "Accept: $acc" -H "Accept-Language: ru-RU,ru;q=0.9" -o out/b -w "sitemap.xml $v ${acc:0:15} %{http_code} %{http_version} %{content_type}\n" $R/sitemap.xml >> out/status.txt
            head -c 200 out/b | tr '\n' ' ' >> out/status.txt; echo >> out/status.txt
          done; done
          curl -sSI --max-time 25 -A "$BR" $R/sitemap.xml | grep -iE "^(HTTP|upgrade|server|content-type|connection|location)" >> out/status.txt
          curl -sS --max-time 25 -A "$BR" $R/sitemap_index.xml -o out/si.xml -w "sitemap_index %{http_code} %{content_type} %{size_download}\n" >> out/status.txt
          head -c 400 out/si.xml > out/sitemap-index-head.txt; grep -o '<loc>[^<]*</loc>' out/si.xml | head -30 > out/sitemap-index-locs.txt
          # follow each sitemap from the index, shape only
          for sm in $(grep -o '<loc>[^<]*</loc>' out/si.xml | sed 's/<[^>]*>//g' | head -8); do
            curl -sS --max-time 25 -A "$BR" "$sm" -o out/x.xml -w "$sm %{http_code} %{content_type} %{size_download}\n" >> out/status.txt
            echo "$sm $(grep -c '<loc>' out/x.xml) locs; sample: $(grep -o '<loc>[^<]*</loc>' out/x.xml | sed 's/<[^>]*>//g' | grep -m3 products | tr '\n' ' ')" >> out/sitemaps.txt
          done
          # a product page: as a bot, and as a browser keeping the cookie the guard sets
          P=$(grep -ho 'https://rockets.coffee/products/[^<]*' out/sitemaps.txt | head -1); echo "product: $P" >> out/status.txt
          [ -z "$P" ] && P=$R/products/
          curl -sS --max-time 25 -A "$UA" -o /dev/null -w "bot product %{http_code} -> %{redirect_url}\n" "$P" | cut -c1-120 >> out/status.txt
          curl -sS --max-time 25 -A "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" -o /dev/null -w "yandexbot-ua product %{http_code}\n" "$P" >> out/status.txt
          curl -sS --max-time 25 -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -o /dev/null -w "googlebot-ua product %{http_code}\n" "$P" >> out/status.txt
          curl -sS --max-time 25 -L -c out/jar -b out/jar -A "$BR" -H "Accept: text/html" -H "Accept-Language: ru-RU,ru;q=0.9" -o out/p.html -w "browser+cookies product %{http_code} %{num_redirects} redirects, final %{url_effective}\n" "$P" | cut -c1-160 >> out/status.txt
          echo "page: $(wc -c < out/p.html) bytes; title: $(grep -o '<title>[^<]*' out/p.html | head -1); ld+json: $(grep -c 'application/ld+json' out/p.html); captcha: $(grep -c -i captcha out/p.html)" >> out/status.txt
          rm -f out/b out/si.xml out/x.xml out/jar out/p.html
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: rockets [skip ci]" && git push
