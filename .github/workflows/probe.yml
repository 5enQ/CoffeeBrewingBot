name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Durable Objects usage (GraphQL analytics) and a log tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf out; mkdir -p out
          A=https://brewbook-ratings.brewbook.workers.dev
          # wait for the new worker (deploy runs in parallel)
          for i in $(seq 1 40); do curl -sS -m 10 "$A/version" | grep -q '"1.3.2"' && break; sleep 15; done
          (timeout 100 npx -y wrangler@4 tail brewbook-ratings --format json > out/tail.jsonl 2> out/tail.err &)
          sleep 15
          curl -sS -m 20 -w " %{http_code}\n" "$A/version" >> out/calls.txt
          curl -sS -m 20 -w " %{http_code}\n" "$A/lookup?url=https://shop.tastycoffee.ru/coffee/braziliya-sul-de-minas" | cut -c1-200 >> out/calls.txt
          curl -sS -m 20 -w " %{http_code}\n" -X POST -H 'Content-Type: application/json' -d '{}' "$A/me" >> out/calls.txt
          curl -sS -m 20 -w " %{http_code}\n" -X POST -H 'Content-Type: application/json' -d '{"at":1}' "$A/reminders" >> out/calls.txt
          curl -sS -m 20 -w " %{http_code}\n" "$A/cards/zzzzzzzz" >> out/calls.txt
          sleep 80
          true
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: usage [skip ci]" && git push
