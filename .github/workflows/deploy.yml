name: Deploy to GitHub Pages

# Releases only: `main` is updated when a release is merged from `dev`.
# The version comes from package.json, the release title from CHANGELOG.md.
# After a successful deploy the commit is tagged vX.Y.Z.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A failing unit test stops the release before anything is deployed
      - run: npm test
      # App version is shown in Profile → "О приложении"
      - id: v
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%s)000" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.v.outputs.version }}
          VITE_APP_BUILT: ${{ steps.v.outputs.built }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release
        run: |
          V="v$(node scripts/release-info.mjs version)"
          TITLE="$(node scripts/release-info.mjs title)"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then echo "$V already tagged"; exit 0; fi
          git config user.name "release-bot"; git config user.email "release-bot@users.noreply.github.com"
          git tag -a "$V" -m "$TITLE"
          git push origin "$V"

  # Bugs fixed in dev (label claude-fixed in the private bug repository) are closed once the release is out
  close-fixed-bugs:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Close the released bug reports
        if: env.GH_ISSUES_TOKEN != ''
        run: |
          V=$(node scripts/release-info.mjs version)
          H=(-H "Authorization: Bearer $GH_ISSUES_TOKEN" -H "Accept: application/vnd.github+json")
          # the private bug repository; the first few reports went to the public one
          for REPO in 5enQ/brewbook-bugs 5enQ/CoffeeBrewingBot; do
          for n in $(curl -sS "${H[@]}" "https://api.github.com/repos/$REPO/issues?state=open&labels=claude-fixed&per_page=100" | jq -r '.[] | select(.pull_request | not) | .number'); do
            curl -sS "${H[@]}" -X POST "https://api.github.com/repos/$REPO/issues/$n/comments" -d "{\"body\":\"Исправление вышло в версии v$V.\"}" > /dev/null
            curl -sS "${H[@]}" -X PATCH "https://api.github.com/repos/$REPO/issues/$n" -d '{"state":"closed","state_reason":"completed"}' > /dev/null
            echo "closed $REPO#$n"
          done
          done
