# Сервер оценок рецептов Brewbook (Cloudflare Workers, бесплатный тариф)
name = "brewbook-ratings"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Один Durable Object на автора: внутри — SQLite с оценками его рецептов
[[durable_objects.bindings]]
name = "AUTHORS"
class_name = "AuthorRatings"

# Рецепты для коротких ссылок «Поделиться»
[[durable_objects.bindings]]
name = "RECIPES"
class_name = "RecipeStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthorRatings"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecipeStore"]

[vars]
# Откуда разрешены запросы (сайт мини-приложения)
ALLOWED_ORIGIN = "https://5enq.github.io"

# Секрет BOT_TOKEN задаётся через `wrangler secret put BOT_TOKEN` (или GitHub Actions)
