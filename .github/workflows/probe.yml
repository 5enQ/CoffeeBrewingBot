name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lookup and fetch
        run: |
          mkdir -p out
          U='https://theweldercatherine.ru/catalog/kofe_v_filtr_pakete/filtr_pakety_efiopiya_pod_molochko_gorbufet_x_twc/'
          curl -sS -m 40 -G 'https://brewbook-ratings.brewbook.workers.dev/lookup' --data-urlencode "url=$U" -o out/welder2_live.json
          curl -sSL -m 30 -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36' -o out/welder2.html "$U"
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add out && git commit -m "probe: welder2 [skip ci]" && git push
