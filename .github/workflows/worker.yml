name: Deploy ratings worker

# Releases only (push to `main`), and only when the server code changed.
# parse.ts and accounts.ts import src/data/scales.ts and src/data/levels.ts, so those count as server code too.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/data/scales.ts', 'src/data/levels.ts', '.github/workflows/worker.yml', 'CHANGELOG.md']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the Cloudflare secrets are configured
    if: ${{ vars.RATINGS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: worker
      - run: npx tsc -p .
        working-directory: worker
      # Readable server version: release version and title, visible in the Cloudflare dashboard
      # (Workers → brewbook-ratings → Deployments) and at /version
      - id: v
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          echo "title=$(node scripts/release-info.mjs title)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%s)000" >> "$GITHUB_OUTPUT"
          # the owner's Telegram id (Profile → "Ваш Telegram ID"): they approve roaster sites
          if [ -n "$OWNER" ]; then echo "owner=--var OWNER_IDS:$OWNER" >> "$GITHUB_OUTPUT"; fi
        env:
          OWNER: ${{ secrets.OWNER_TELEGRAM_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --tag "v${{ steps.v.outputs.version }}" --message "${{ steps.v.outputs.title }}" --var VERSION:${{ steps.v.outputs.version }} --var BUILT_AT:${{ steps.v.outputs.built }} ${{ steps.v.outputs.owner }}
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
