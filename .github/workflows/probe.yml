name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry crawl
        run: |
          rm -rf out; mkdir -p out
          cd code && mkdir -p out && node --experimental-strip-types --no-warnings dry.mts > out/dry.log 2>&1; cd ..; mv code/out/* out/
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: sitemaps [skip ci]" && git push
