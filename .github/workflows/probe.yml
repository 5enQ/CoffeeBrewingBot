name: Probe rockets.coffee
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reachability (status codes and timings only)
        run: |
          rm -rf out; mkdir -p out
          UA="Mozilla/5.0 (compatible; BrewbookBot/1.0; +https://5enq.github.io/CoffeeBrewingBot/)"
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          { echo "runner: $(curl -s --max-time 10 https://ipinfo.io/country 2>/dev/null)"; getent hosts rockets.coffee | awk '{print "dns", $1}'; } >> out/status.txt
          for u in / /robots.txt /sitemap.xml /sitemap_index.xml /products/ ; do
            for a in "$UA" "$BR"; do
              curl -sS --max-time 25 -o out/body -A "$a" -w "$u ${a:0:20} %{http_code} %{time_total}s %{remote_ip} -> %{redirect_url}\n" "https://rockets.coffee$u" >> out/status.txt 2>&1 || echo "$u ${a:0:20} FAIL" >> out/status.txt
            done
          done
          nc -vz -w 10 rockets.coffee 443 >> out/status.txt 2>&1 || true
          ping -c 2 -W 3 rockets.coffee >> out/status.txt 2>&1 || true
          # only the shape of the sitemap, if any came back
          curl -sS --max-time 25 -A "$BR" https://rockets.coffee/sitemap.xml -o out/sm.xml 2>/dev/null || true
          if [ -s out/sm.xml ]; then head -c 600 out/sm.xml > out/sitemap-head.txt; grep -o '<loc>[^<]*</loc>' out/sm.xml | head -20 > out/sitemap-locs.txt; grep -c '<loc>' out/sm.xml >> out/sitemap-locs.txt; fi
          rm -f out/body out/sm.xml
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -A out && git commit -m "probe: rockets [skip ci]" && git push
