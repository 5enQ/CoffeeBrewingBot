name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          mkdir -p out
          curl -sS -m 20 https://brewbook-ratings.brewbook.workers.dev/version -o out/version.json
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add out && git commit -m "probe: version [skip ci]" && git push
