name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lookup welder via worker
        run: |
          mkdir -p out
          W='https://brewbook-ratings.brewbook.workers.dev/lookup'
          curl -sS -m 40 -G "$W" --data-urlencode 'url=https://theweldercatherine.ru/catalog/kofe_v_filtr_pakete/filtr_pakety_kosta_rika_esteban_zamora/' -o out/welder_live.json
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add out && git commit -m "probe: welder live [skip ci]" && git push
