name: Probe catalog lookup
on:
  push:
    branches: [probe-pages]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch welder pages
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36'
          curl -sSL -m 30 -A "$UA" -o out/welder.html 'https://theweldercatherine.ru/catalog/kofe_v_filtr_pakete/filtr_pakety_kosta_rika_esteban_zamora/'
          curl -sSL -m 30 -A "$UA" -o out/welder_mix.html 'https://theweldercatherine.ru/catalog/kofe_v_filtr_pakete/assorti_filtr_paketov_start_4_60_sht/'
      - name: Commit
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add out && git commit -m "probe: welder [skip ci]" && git push
